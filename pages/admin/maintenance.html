<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance | EasyPark Admin</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body data-portal="admin">

  <div id="nav-slot"></div>

  <div class="page-head">
    <p class="crumb">Admin Portal · Maintenance Management</p>
    <h1><svg class="head-ico big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Maintenance &amp; Fault Control</h1>
    <p class="sub">Change the fault status of any sensor/component per spot, triage tickets and log technician work.</p>
  </div>

  <div class="content">
    <!-- Component health control -->
    <section class="panel mb-4">
      <div class="panel-head">
        <h2><svg class="head-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Component health per spot</h2>
        <span class="muted">click a chip to toggle OK / FAULT</span>
      </div>
      <div class="panel-body">
        <div class="comp-grid" id="comp-grid"></div>
      </div>
    </section>

    <div class="layout-2col">
      <!-- Fault queue -->
      <section class="panel">
        <div class="panel-head"><h2><svg class="head-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>Open fault queue</h2></div>
        <div class="panel-body" id="issue-list"></div>
      </section>

      <!-- Right: report form + maintenance log -->
      <aside class="flex flex-col gap-4">
        <section class="panel">
          <div class="panel-head"><h2><svg class="head-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Report a fault</h2></div>
          <div class="panel-body">
            <form id="report-form">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Spot</label>
                  <select class="form-select" id="rep-slot">
                    <option value="">Choose…</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Component</label>
                  <select class="form-select" id="rep-comp"></select>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Issue description</label>
                <textarea class="form-textarea" id="rep-issue" placeholder="e.g. LED strip not responding on slot 103"></textarea>
              </div>
              <div class="form-group">
                <label class="form-label">Technician</label>
                <input class="form-input" id="rep-tech" placeholder="e.g. R. Shah">
              </div>
              <button type="submit" class="btn btn-primary w-full">Log fault ticket</button>
            </form>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head"><h2><svg class="head-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Maintenance log</h2></div>
          <div class="panel-body"><div id="maint-log"></div></div>
        </section>
      </aside>
    </div>
  </div>

  <script src="../../js/db.js"></script>
  <script src="../../js/ui.js"></script>
  <script>
    (function () {
      'use strict';
      const UI = window.UI, EP = window.EasyPark;
      if (!UI.requireAdmin()) return;

      const ISSUE_BADGE = {
        operational: 'badge-operational', under_maintenance: 'badge-maintenance',
        sensor_fault: 'badge-fault', electrical_fault: 'badge-fault',
        inspection_pending: 'badge-inspection'
      };
      const ISSUE_TONE = {
        operational: '', under_maintenance: '', sensor_fault: ' sensor_fault',
        electrical_fault: ' electrical_fault', inspection_pending: ' inspection_pending'
      };

      /* ---------- component health grid ---------- */
      function renderHealth() {
        const grid = UI.qs('#comp-grid');
        grid.innerHTML = '';
        EP.SLOT_META.forEach(meta => {
          const slot = EP.getSlot(meta.id);
          const h = EP.raw().health[meta.id] || {};
          const card = UI.el('div', 'comp-card');
          card.innerHTML =
            '<div class="comp-title">' +
              '<b>Spot ' + meta.id + '</b>' +
              '<span class="badge badge-' + slot.status + '">' + slot.status + '</span>' +
            '</div><div class="comp-chips"></div>';
          const chips = UI.qs('.comp-chips', card);
          EP.COMPONENTS.forEach(c => {
            const bad = h[c.key] === 'fault';
            const chip = UI.el('button', 'comp-chip ' + (bad ? 'fault' : 'ok'),
              (bad ? UI.icon('x', 12) : UI.icon('check', 12)) + ' ' + c.name + ': ' + (bad ? 'FAULT' : 'OK'));
            chip.type = 'button';
            chip.title = 'Toggle ' + c.name + ' status';
            chip.addEventListener('click', () => {
              EP.setComponentHealth(meta.id, c.key, bad);
              UI.toast('Spot ' + meta.id + ' · ' + c.name + ' → ' + (bad ? 'OK' : 'FAULT'), 'info');
              refresh();
            });
            chips.appendChild(chip);
          });
          grid.appendChild(card);
        });
      }

      /* ---------- open issue queue ---------- */
      function renderIssues() {
        const list = EP.getIssues().filter(i => i.open);
        const box = UI.qs('#issue-list');
        if (!list.length) {
          box.innerHTML = '<div class="empty"><div class="empty-icon"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div><p>No open faults. Everything operational.</p></div>';
          return;
        }
        box.innerHTML = '';
        list.forEach(i => {
          const comp = EP.COMPONENTS.find(c => c.key === i.component);
          const ticket = UI.el('div', 'panel mb-4 issue-ticket' + (ISSUE_TONE[i.status] || ''));
          const opts = EP.MAINT_STATES.map(s =>
            '<option value="' + s.key + '"' + (s.key === i.status ? ' selected' : '') + '>' + s.label + '</option>').join('');

          ticket.innerHTML =
            '<div class="panel-body">' +
              '<div class="flex justify-between items-center" style="flex-wrap:wrap; gap:.6rem">' +
                '<div>' +
                  '<b class="mono">' + i.id + '</b>' +
                  ' <span class="badge ' + (ISSUE_BADGE[i.status] || 'badge-maintenance') + '">' + i.status + '</span>' +
                '</div>' +
                '<div class="row-actions">' +
                  '<select class="select-sm" data-status="' + i.id + '">' + opts + '</select>' +
                  '<button class="btn btn-success btn-xs" data-resolve="' + i.id + '">Resolve</button>' +
                  '<button class="btn btn-outline btn-xs" data-log="' + i.id + '">Log entry</button>' +
                '</div>' +
              '</div>' +
              '<p class="mt-3" style="font-size:.9rem; margin-bottom:.2rem">Spot <b>' + i.slotId + '</b> · ' +
                (comp ? comp.name : i.component) + '</p>' +
              '<p class="text-muted" style="font-size:.82rem; margin:0">' + UI.esc(i.issue) + '</p>' +
            '</div>';

          const statusSel = UI.qs('[data-status="' + i.id + '"]', ticket);
          statusSel.addEventListener('change', () => {
            EP.setIssueStatus(i.id, statusSel.value);
            UI.toast(i.id + ' → ' + statusSel.value.replace(/_/g, ' '), 'success');
            refresh();
          });
          UI.qs('[data-resolve="' + i.id + '"]', ticket).addEventListener('click', () => {
            EP.setIssueStatus(i.id, 'operational');
            UI.toast(i.id + ' resolved — spot operational again', 'success');
            refresh();
          });
          UI.qs('[data-log="' + i.id + '"]', ticket).addEventListener('click', () => openLog(i));
          box.appendChild(ticket);
        });
      }

      /* ---------- maintenance log entries (all tickets) ---------- */
      function renderLog() {
        const entries = [];
        EP.getIssues().forEach(i => i.log.forEach(l => entries.push({ issue: i, entry: l })));
        entries.sort((a, b) => b.entry.date > a.entry.date ? 1 : -1);

        const box = UI.qs('#maint-log');
        if (!entries.length) {
          box.innerHTML = '<p class="empty">No maintenance activity yet.</p>';
          return;
        }
        box.innerHTML = '';
        entries.slice(0, 12).forEach(e => {
          box.appendChild(UI.el('div', 'notif',
            '<span class="notif-icon" style="background:#6b7280">' + UI.icon('gear', 16) + '</span>' +
            '<div><p><b>' + e.issue.id + '</b> · Spot ' + e.issue.slotId + ' · ' +
              UI.esc(e.entry.issue) + '</p>' +
              '<small>' + EP.fmtDate(e.entry.date) + ' · ' + UI.esc(e.entry.technician) + ' · ' +
              UI.esc(e.entry.resolutionStatus) + '</small></div>'));
        });
      }

      /* ---------- log-entry modal for a ticket ---------- */
      function openLog(issue) {
        const m = UI.openModal('Log entry — ' + issue.id, '', '');
        const logHTML = issue.log.map(l =>
          '<div class="notif"><div><p style="font-size:.82rem">' + UI.esc(l.issue) + '</p>' +
          '<small>' + EP.fmtDate(l.date) + ' · ' + UI.esc(l.technician) + ' · ' +
          UI.esc(l.resolutionStatus) + '</small></div></div>').join('') || '<p class="empty">No entries</p>';

        m.body.innerHTML =
          '<div class="mb-4" style="max-height:180px; overflow:auto">' + logHTML + '</div>' +
          '<hr class="divider">' +
          '<div class="form-row">' +
            '<div class="form-group"><label class="form-label">Date</label>' +
            '<input class="form-input" type="date" id="log-date" value="' + EP.todayISO() + '"></div>' +
            '<div class="form-group"><label class="form-label">Technician</label>' +
            '<input class="form-input" id="log-tech" placeholder="Technician name"></div>' +
          '</div>' +
          '<div class="form-group"><label class="form-label">Work description</label>' +
          '<textarea class="form-textarea" id="log-desc" placeholder="What was checked / fixed…"></textarea></div>' +
          '<div class="form-group"><label class="form-label">Resolution status</label>' +
          '<select class="form-select" id="log-status"><option>Pending</option><option>In progress</option><option>Resolved</option></select></div>' +
          '<button class="btn btn-primary w-full" id="log-save">Add entry</button>';

        UI.qs('#log-save', m.overlay).onclick = () => {
          EP.addIssueLog(issue.id, {
            date: UI.qs('#log-date', m.overlay).value,
            technician: UI.qs('#log-tech', m.overlay).value || '—',
            issue: UI.qs('#log-desc', m.overlay).value || issue.issue,
            resolutionStatus: UI.qs('#log-status', m.overlay).value
          });
          UI.toast('Entry added to ' + issue.id, 'success');
          m.close();
          refresh();
        };
      }

      /* ---------- report fault form ---------- */
      function initReportForm() {
        const slotSel = UI.qs('#rep-slot');
        EP.SLOT_META.forEach(m => {
          slotSel.insertAdjacentHTML('beforeend', '<option value="' + m.id + '">' + m.id + ' — ' + m.level + '</option>');
        });
        const compSel = UI.qs('#rep-comp');
        EP.COMPONENTS.forEach(c => {
          compSel.insertAdjacentHTML('beforeend', '<option value="' + c.key + '">' + c.name + '</option>');
        });
        UI.qs('#report-form').addEventListener('submit', e => {
          e.preventDefault();
          const slotId = slotSel.value;
          const comp = compSel.value;
          if (!slotId || !comp) { UI.toast('Pick a spot and a component', 'error'); return; }
          const id = EP.reportIssue(slotId, comp, UI.qs('#rep-issue').value.trim(), UI.qs('#rep-tech').value.trim());
          UI.qs('#rep-issue').value = ''; UI.qs('#rep-tech').value = '';
          UI.toast('Fault ticket ' + id + ' opened', 'success');
          refresh();
        });
      }

      function refresh() {
        renderHealth();
        renderIssues();
        renderLog();
      }

      initReportForm();
      refresh();
      window.EasyParkLiveRefresh = refresh;
    })();
  </script>
</body>
</html>
