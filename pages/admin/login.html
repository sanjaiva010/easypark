<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | EasyPark</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body data-portal="">

  <div class="login-wrap">
    <div class="login-card">
      <img src="../../assets/logo.svg" alt="EasyPark logo" class="login-logo" width="72" height="72">
      <div class="script-text">EasyPark</div>
      <p class="login-sub">Administrator — Management Console</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" id="a-user" placeholder="admin" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="a-pass" placeholder="••••••••" autocomplete="current-password">
          <span class="form-error visible" id="login-error" style="display:none"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-full">Sign in to Console</button>
      </form>

      <div class="demo-creds">
        <b>Demo credentials</b><br>
        Username: <code>admin</code> · Password: <code>park2026</code>
      </div>

      <p class="text-center mt-6" style="font-size:.8rem">
        <a href="../../index.html">← Back to portal selection</a>
      </p>
    </div>
  </div>

  <script src="../../js/db.js"></script>
  <script src="../../js/ui.js"></script>
  <script>
    (function () {
      'use strict';
      const UI = window.UI, EP = window.EasyPark;

      // Already signed in? Go straight to the console.
      if (EP.isAdmin()) location.href = 'dashboard.html';

      UI.qs('#login-form').addEventListener('submit', e => {
        e.preventDefault();
        const res = EP.adminLogin(
          UI.qs('#a-user').value.trim(),
          UI.qs('#a-pass').value
        );
        if (res.ok) {
          UI.toast('Welcome back, administrator', 'success');
          location.href = 'dashboard.html';
        } else {
          const errEl = UI.qs('#login-error');
          errEl.style.display = 'block';
          errEl.textContent = res.message;
          UI.toast(res.message, 'error');
        }
      });
    })();
  </script>
</body>
</html>
